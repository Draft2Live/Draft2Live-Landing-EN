<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002365"/>
      <stop offset="100%" stop-color="#031931"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#04b8b7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04b8b7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#04b8b7" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#031931" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#031931" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="600" cy="320" rx="620" ry="300" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#edgeFade)"/>

  <!-- Corner accent lines -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#04b8b7" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="60" y1="60" x2="60" y2="140" stroke="#04b8b7" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="1140" y1="570" x2="1060" y2="570" stroke="#04b8b7" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="1140" y1="570" x2="1140" y2="490" stroke="#04b8b7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Logo (top-left) — plain text wordmark "draft2live", no stylized d-glyph.
       Rendered as <text> with system sans-serif so librsvg/sharp rasterize it predictably. -->
  <text x="60" y="100"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="58"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="-1.8">draft2live</text>

  <!-- Stats badge pill (mirrors hero badge on the actual landing) -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="935" height="44" rx="22" fill="#04b8b7" fill-opacity="0.07" stroke="#04b8b7" stroke-opacity="0.32" stroke-width="1"/>
    <text x="24" y="29" font-family="Inter, Lato, Arial, sans-serif" font-size="17" font-weight="600" fill="#5eead4" letter-spacing="2.5">5,000+ ARTICLES PUBLISHED  ·  45 LANGUAGES  ·  WORDPRESS + DRUPAL + SHOPIFY</text>
  </g>

  <!-- Headline — matches hero H1: "From keyword to / a live SEO article / done before your coffee." -->
  <text x="60" y="328" font-family="Inter, Lato, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2.2">From keyword to</text>
  <text x="60" y="416" font-family="Inter, Lato, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-2.2" xml:space="preserve"><tspan fill="#ffffff">a live </tspan><tspan fill="#04b8b7">SEO article</tspan></text>
  <text x="60" y="504" font-family="Inter, Lato, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2.2">done before your coffee.</text>

  <!-- Subhead -->
  <text x="60" y="554" font-family="Inter, Lato, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">SERP research · tone of voice · one-click WordPress / Drupal / Shopify Blog publishing.</text>

  <!-- Bottom strip -->
  <line x1="60" y1="598" x2="220" y2="598" stroke="#04b8b7" stroke-width="2"/>
  <text x="60" y="588" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="500" fill="#04b8b7" letter-spacing="2">en.draft2live.com</text>
  <text x="1140" y="588" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="500" fill="#5eead4" letter-spacing="2" fill-opacity="0.75">AI-TO-CMS PUBLISHING ENGINE</text>
</svg>
